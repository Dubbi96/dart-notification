version: '3.8'

services:
  postgres:
    # DAR-378: TimescaleDB(pg15 기반) — 대규모 분봉/일봉 시계열 효율화(하이퍼테이블·압축·연속집계).
    # pg15 호환 이미지라 기존 postgres_data(PG15) 볼륨을 그대로 사용한다 — 데이터 손실 0.
    # 확장 활성화는 마이그레이션(CREATE EXTENSION IF NOT EXISTS timescaledb)이 수행한다.
    # ★이미지 교체는 사용자 적용 단계: 컨테이너 재생성(docker-compose up -d) 후 휴먼 승인하에 migrate deploy.
    image: timescale/timescaledb:2.17.2-pg15
    container_name: dart-notification-db
    restart: always
    # DAR-382: shared_preload_libraries 영구 반영. 기존 PG15 볼륨에 timescaledb 이미지를 올리면
    # 이미지가 conf 를 자동 수정하지 않아 'extension timescaledb must be preloaded' 로 CREATE EXTENSION 이
    # 실패한다(SHOW shared_preload_libraries → 빈값). command 로 명시해 신규/기존 볼륨 모두 확장이 적재되게 한다.
    # postgres entrypoint 에 -c 플래그를 넘기면 postgresql.conf 의 빈 기본값을 덮어쓴다.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dart_notification
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dart-notification-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
