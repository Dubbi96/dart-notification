version: '3.8'

services:
  postgres:
    # DAR-378: TimescaleDB(pg15 기반) — 대규모 분봉/일봉 시계열 효율화(하이퍼테이블·압축·연속집계).
    # pg15 호환 이미지라 기존 postgres_data(PG15) 볼륨을 그대로 사용한다 — 데이터 손실 0.
    # 확장 활성화는 마이그레이션(CREATE EXTENSION IF NOT EXISTS timescaledb)이 수행한다.
    # ★이미지 교체는 사용자 적용 단계: 컨테이너 재생성(docker-compose up -d) 후 휴먼 승인하에 migrate deploy.
    image: timescale/timescaledb:2.17.2-pg15
    container_name: dart-notification-db
    restart: always
    # DAR-382: shared_preload_libraries=timescaledb 를 command 로 명시한다.
    #   timescaledb 이미지의 자동 conf 설정은 '신규 볼륨 초기화' 시에만 동작한다. 기존 PG15
    #   postgres_data 볼륨을 재사용하면 conf 가 갱신되지 않아 'extension timescaledb must be
    #   preloaded' 로 확장 적재가 실패한다. command 오버라이드는 볼륨 신규/기존과 무관하게 매
    #   기동 시 preload 를 강제하므로, docker-compose up -d 재생성만으로 수동 ALTER SYSTEM 없이
    #   CREATE EXTENSION 이 성공한다.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dart_notification
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dart-notification-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
