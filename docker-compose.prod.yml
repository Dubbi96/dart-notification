# ─────────────────────────────────────────────────────────────────────────────
# DAR-427 · Phase2 — 무료클라우드(Oracle Cloud Always Free, ARM64) 운영 배포 compose
#
# 백엔드(NestJS) + Postgres(TimescaleDB) + Redis 를 단일 VM 에 24/7 구동한다.
# 대상: Oracle Cloud Always Free 의 Ampere A1(ARM64) Ubuntu VM.
#
# ★ARM64(arm64/aarch64) 호환:
#   - timescale/timescaledb:2.17.2-pg15 · redis:7-alpine · node:20-alpine(backend 베이스)
#     모두 multi-arch(linux/arm64) 매니페스트를 제공한다 → A1 에서 그대로 pull/build.
#   - backend 이미지는 호스트 아키텍처(arm64)로 로컬 빌드되므로 별도 플랫폼 지정 불요.
#
# 보안:
#   - 시크릿은 backend/.env.prod(gitignore) 에만 둔다. 저장소에는 .env.prod.example 만 커밋.
#   - postgres/redis 포트는 호스트로 노출하지 않는다(컨테이너 네트워크 내부 통신만).
#     외부에 여는 포트는 backend 3000 하나뿐 → 공격면 최소화.
#
# 사용:
#   docker compose -f docker-compose.prod.yml up -d            # 기동
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate   # DB 스키마 1회 반영
#   docker compose -f docker-compose.prod.yml logs -f backend  # 로그
#   docker compose -f docker-compose.prod.yml down             # 정지(볼륨 유지)
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    # TimescaleDB(pg15 기반) — dev compose 와 동일 이미지로 일관(DAR-378). arm64 multi-arch.
    image: timescale/timescaledb:2.17.2-pg15
    container_name: dart-prod-db
    restart: unless-stopped
    # DAR-382: 확장 사전적재(preload). 미지정 시 CREATE EXTENSION timescaledb 가 실패한다.
    command: postgres -c shared_preload_libraries=timescaledb
    # POSTGRES_USER/PASSWORD/DB 는 .env.prod 에서 주입한다(DATABASE_URL 과 반드시 일치).
    env_file:
      - ./backend/.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ★포트 미노출: DB 는 컨테이너 네트워크 내부에서 backend 만 접근. 호스트/외부 차단.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dart-prod

  redis:
    image: redis:7-alpine
    container_name: dart-prod-redis
    # OPS-3: unless-stopped → always 격상. OOM-kill 등 비정상 종료 후에도 무조건 재기동.
    restart: always
    # appendonly 영속 + (선택) 비밀번호. REDIS_PASSWORD 미설정이면 빈 값 → 비밀번호 없이 기동.
    # $$ 로 compose 보간을 막아 컨테이너 sh 가 env_file 의 REDIS_PASSWORD 로 런타임 확장한다.
    # OPS-3: maxmemory 128mb 상한 — micro(1GB) 에서 redis 가 무한 성장해 호스트 OOM 을
    # 유발하는 것을 차단한다. maxmemory-policy 는 반드시 noeviction(redis 기본값을 명시 고정):
    # BullMQ 는 잡 메타데이터가 evict 되면 큐가 조용히 깨지므로 allkeys-lru 등 eviction 금지.
    # 상한 도달 시 쓰기 에러로 fail-loud → 백엔드 로그에서 즉시 발견 가능.
    command:
      [
        'sh',
        '-c',
        'redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}',
      ]
    env_file:
      - ./backend/.env.prod
    volumes:
      - redis_data:/data
    # ★포트 미노출: backend 만 내부 네트워크로 접근.
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dart-prod

  backend:
    # 호스트 아키텍처(arm64)로 빌드. image 태그를 고정해 migrate 잡이 동일 이미지를 재사용한다.
    build:
      # AOS 공용 Rule Engine 패키지가 저장소 루트 packages/ 아래에 있어 루트 context가 필요하다.
      context: .
      dockerfile: backend/Dockerfile
    image: dart-notification-backend:prod
    container_name: dart-prod-backend
    # OPS-3: unless-stopped → always 격상. OOM-kill·재부팅 후에도 무조건 재기동.
    restart: always
    # OPS-3: 컨테이너 메모리 상한 — micro(1GB) 호스트에서 backend 폭주가 호스트 전체
    # OOM(단일장애점)으로 번지는 것을 차단한다. 초과 시 이 컨테이너만 kill → restart: always 로 복구.
    mem_limit: 640m
    env_file:
      - ./backend/.env.prod
    environment:
      # OPS-3: V8 old-space 상한(448MB) — mem_limit(640m) 아래에서 GC 가 먼저 동작하게 해
      # 컨테이너 OOM-kill 이전에 힙 압박을 해소한다(여유분은 buffers/native 몫).
      # env_file 값보다 우선 적용되므로 .env.prod 에 NODE_OPTIONS 를 두지 않는다.
      NODE_OPTIONS: --max-old-space-size=448
    ports:
      - '3000:3000' # 유일하게 외부로 여는 포트(헬스/HTTP API).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node:20 의 전역 fetch 사용(alpine 에 curl 미포함). /health 는 글로벌 prefix 제외 경로.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dart-prod

  # ── DB 스키마 반영(prisma migrate deploy) — 1회성 옵션 잡 ──────────────────────
  # 운영 안전을 위해 backend 기동 경로에서 분리한다(자동 마이그레이션 금지).
  # 명시 실행만: docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  # prisma CLI 는 backend package.json 의 dependencies 라 prod 이미지(--omit=dev)에도 포함된다.
  migrate:
    image: dart-notification-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dart-prod-migrate
    profiles: ['migrate'] # up -d 시 기동 안 함. run --rm 으로만 실행.
    env_file:
      - ./backend/.env.prod
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - dart-prod

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  dart-prod:
    driver: bridge
