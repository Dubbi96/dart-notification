# [서브플로우] 콜드스타트 → 게스트 진입 (W15 ②)
# clearState 후 인트로(건너뛰기) → 로그인 화면(로그인 없이 둘러보기) → 홈 피드.
# 상위 플로우에서 runFlow 로만 사용한다(maestro test .maestro/ 는 최상위 파일만 실행).
appId: com.gongsion.app
---
- launchApp:
    clearState: true
# 첫 실행이면 인트로 캐러셀 — '건너뛰기'로 로그인 화면 이동(이미 본 상태면 스킵).
- runFlow:
    when:
      visible: "건너뛰기"
    commands:
      - tapOn: "건너뛰기"
# 로그인 화면 → 게스트 둘러보기.
- extendedWaitUntil:
    visible:
      id: "guest-browse-button"
    timeout: 15000
- tapOn:
    id: "guest-browse-button"
# 홈 피드 렌더 확인(백지 회귀 직격 앵커).
- extendedWaitUntil:
    visible:
      id: "home-feed-list"
    timeout: 15000
